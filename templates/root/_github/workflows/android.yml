name: Android Build & Release

# Push to main (or run by hand) -> build a signed AAB on GitHub's runner -> upload to Google Play.
# No EAS servers: `expo prebuild` generates android/ on the runner, then plain Gradle builds it.
# Only mobile changes trigger it, so a web/API fix never starts a Play release.
on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package-lock.json"
      - "!**/*.md"
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (internal / alpha / beta / production)"
        required: false
        default: ""

env:
  # New apps start on the internal track. Switch to production once the app is live and tested.
  PLAY_TRACK: internal

jobs:
  android:
    name: Build & Release Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: zulu, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Expo prebuild (generate android/)
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --no-install

      # After prebuild: --clean wipes android/
      - name: Decode keystore
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build release bundle (AAB)
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: release.keystore # read by plugins/withSigning.js (relative to android/app)
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_SERVICE_ACCOUNT_JSON }}
          packageName: __PACKAGE_ID__
          releaseFiles: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.track || env.PLAY_TRACK }}
          status: completed
          whatsNewDirectory: apps/mobile/distribution/whatsnew

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
